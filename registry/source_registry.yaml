# Purpose: Track source origins, traceability, reliability, freshness, and reuse permissions for KnowledgeOS / GosseOS / Operator Fischer artifacts.
# Counterparts: registry/artifacts.yaml, registry/artifact_schema.yaml, governance/verification_checklist.md
# Owner principle: Human remains owner. AI remains tool.

