source_validation_template:
  source_id: "SRC-XXXX"
  title: "Source title"
  source_type: "GitHub File | Memory Baseline | Chat Input | Uploaded File | External Web Source | Tool Output"
  location: "Exact source path, file, chat context, memory baseline, URL, or commit"
  owner: "Operator Fischer / external owner / unknown"
  traceability_level: "T0 | T1 | T2 | T3"
  reliability_level: "R0 | R1 | R2 | R3 | R4 | R5"
  reuse_class: "internal | public_safe | restricted | archive_only"
  status: "active | deprecated | archived | conflict"
  freshness: "stable_architecture | active_product_or_code | external_current_information | memory_baseline"
  supports_artifacts:
    - "KOS-XXXX"
  summary: "Short description of what the source supports."
  validation_notes: "Known limits, conflicts, or required refresh actions."

blocker_conditions:
  - "No source_id or source_location exists for a reusable artifact."
  - "Source cannot be traced beyond vague memory or unknown chat context."
  - "External factual claim is time-sensitive but not refreshed."
  - "AI-generated draft is treated as verified source without review."
  - "A source contradicts a canonical artifact and no conflict note exists."
  - "A career-critical or public-facing source is used without truth-boundary review."
  - "A high-risk automation or governance artifact lacks owner approval."

release_integration:
  checked_status_requires:
    - "At least T1 traceability"
    - "Reliability level not R0"
    - "Source limitations documented"
  verified_status_requires:
    - "At least T2 traceability"
    - "Reliability level R2 or higher"
    - "Source validation completed"
  canonical_status_requires:
    - "At least T2 traceability, preferably T3"
    - "Reliability level R3 or higher for internal sources"
    - "Owner approval"
    - "No unresolved source conflict"
  conflict_status_required_when:
    - "Traceability is T0"
    - "Reliability is R0 and artifact is proposed for reuse"
    - "Source contradiction is unresolved"

