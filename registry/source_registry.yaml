purpose:
  - "Make every reusable artifact source traceable."
  - "Prevent unverified notes, chats, files, memory fragments, or external references from being treated as source of truth."
  - "Support source validation before artifact release."
  - "Classify source reliability, freshness, and permitted reuse."
  - "Connect source records to artifact registry entries and drift reports."

source_rules:
  - "Every reusable artifact should reference at least one source_id or explicit source_location."
  - "A source may support an artifact, but it does not become canonical unless the artifact passes verification and owner approval."
  - "Memory-based sources require a clear baseline name or extraction context."
  - "Chat-based sources require date/context summary where possible."
  - "GitHub-based sources should include repository, path, and commit where possible."
  - "External factual claims require source refresh if the claim is time-sensitive or high-impact."
  - "Unknown, missing, or unverifiable sources must block canonical release."
  - "AI-generated content is treated as draft input until verified."

source_types:
  - "GitHub Repository"
  - "GitHub File"
  - "Git Commit"
  - "Chat Input"
  - "Uploaded File"
  - "Memory Baseline"
  - "PDF"
  - "Local File"
  - "External Web Source"
  - "Manual Note"
  - "Generated Artifact"
  - "Tool Output"

traceability_levels:
  T0:
    label: "missing"
    meaning: "No usable source reference exists."
    release_effect: "Blocks verified and canonical status."
  T1:
    label: "partial"
    meaning: "Source type or context is known, but exact path, file, commit, or baseline is incomplete."
    release_effect: "May allow checked status, not canonical."
  T2:
    label: "traceable"
    meaning: "Source is clearly identifiable by path, file, repo, date, memory baseline, or source context."
    release_effect: "May allow verified status."
  T3:
    label: "pinned"
    meaning: "Source is fixed to path plus commit, version, file hash, document version, or explicit dated baseline."
    release_effect: "Required for high-impact canonical release where possible."

reliability_levels:
  R0:
    label: "unknown"
    meaning: "Reliability cannot be assessed."
  R1:
    label: "raw"
    meaning: "Raw user input, notes, or generated draft; useful but not verified."
  R2:
    label: "working"
    meaning: "Structured source used operationally but not independently verified."
  R3:
    label: "verified_internal"
    meaning: "Reviewed internal source with traceable context."
  R4:
    label: "authoritative_internal"
    meaning: "Canonical internal source approved by owner."
  R5:
    label: "authoritative_external"
    meaning: "Trusted external primary source or official documentation."

freshness_policy:
  stable_architecture:
    refresh_required: "on material change"
    examples:
      - "Artifact schema"
      - "Release policy"
      - "Canonical terms"
  active_product_or_code:
    refresh_required: "before implementation or release"
    examples:
      - "Prompterator code"
      - "Repository files"
      - "Runtime configuration"
  external_current_information:
    refresh_required: "before use"
    examples:
      - "Prices"
      - "Laws"
      - "Software versions"
      - "Company facts"
      - "Public API documentation"
  memory_baseline:
    refresh_required: "when conflicting memory, newer artifact, or drift signal appears"

reuse_classes:
  internal:
    meaning: "For private Operator Fischer / KnowledgeOS / GosseOS architecture use."
  public_safe:
    meaning: "Can be adapted for external/public output after terminology and credential review."
  restricted:
    meaning: "Requires explicit owner review before reuse."
  archive_only:
    meaning: "Historical reference only; not an active source for new outputs."

