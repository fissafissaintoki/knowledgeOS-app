registry_rules:
  - "Every artifact must have a unique artifact_id."
  - "Every artifact must have a clear status: canonical, active, draft, experimental, deprecated, or archived."
  - "Canonical artifacts are default sources of truth."
  - "Deprecated artifacts must not be used as active output sources unless explicitly requested for archive context."
  - "All reusable artifacts require source_location, core_patterns, linked_artifacts, drift_risk, verification_status, governance_notes, and reuse_rules."
  - "Human owner remains accountable. AI systems may assist, structure, compare, and verify but do not own artifacts."

