# KnowledgeOS Skill Registry
# Purpose: Extracted reusable skills from Operator Fischer / Prompterator / KnowledgeOS work.
# Owner principle: Human remains owner. AI remains tool.

registry_id: KOS-SKILL-REGISTRY-0001
