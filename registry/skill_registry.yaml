version: "v1.0"
status: "active"
owner: "Operator Fischer"
created_at: "2026-05-19"
updated_at: "2026-05-19"

skill_rules:
  - "A skill is a reusable operational capability, not just a prompt."
  - "Each skill must have trigger signals, output contract, quality gate, and reuse rules."
  - "Skills may route to prompts, workflows, templates, files, builders, or governance checks."
  - "A skill becomes implementation-ready only after at least one runtime test or proof-of-work."
  - "Human owner remains responsible for approval, release, and real-world use."

skills:
  - skill_id: "SKILL-0001"
    title: "Intent-to-Artifact Routing"
    status: "active"
    maturity: "tested"
    linked_artifacts:
      - "KOS-0026"
      - "KOS-0020"
      - "KOS-0022"
      - "KOS-0023"
      - "KOS-0024"
      - "KOS-0025"
      - "KOS-0027"
    purpose: "Detect explicit requested artifact type and route to the correct specialized builder before generic conversion."
    trigger_signals:
      - "Codex-Handoff-Prompt"
      - "LinkedIn-Post"
      - "Forschungsbrief"
      - "SOP"
      - "Bewerbungsprofil"
      - "Entscheidungsmatrix"
    output_contract: "Selected builder mode and primary requested artifact."
    usability_level: "high"
    use_when:
      - "User names a concrete output type."
      - "Prompterator must avoid generic dossier overproduction."
    do_not_use_when:
      - "User explicitly asks for a broad portfolio, dossier, or PDF."
    quality_gate:
      - "Primary requested artifact appears first."
      - "No Executive/Portfolio/Dossier structure unless explicitly requested."

