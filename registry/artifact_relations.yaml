    reason: "Release policy controls status transitions and canonical approval."

impact_analysis_rules:
  - trigger: "Artifact status changes to canonical"
    required_checks:
      - "Check all incoming requires/constrains relations."
      - "Check deprecated term conflicts."
      - "Check source traceability."
      - "Update registry/artifacts.yaml."
      - "Update README if public structure changes."
  - trigger: "Artifact status changes to deprecated"
    required_checks:
      - "Identify replacement artifact."
      - "Update replaced_by relation."
      - "Scan dependent artifacts for active references."
      - "Update deprecated_terms.yaml if terminology-related."
  - trigger: "Artifact content changes materially"
    required_checks:
      - "Review version increment."
      - "Update source_registry commit reference if file-based."
      - "Run drift report if pattern, governance, or release logic changed."
  - trigger: "New pattern is added"
    required_checks:
      - "Link to source artifact or source_id."
      - "Classify layer."
      - "Check canonical terms."
      - "Add relation if it supports, requires, or constrains existing artifacts."
  - trigger: "Public-facing output is generated"
    required_checks:
      - "Apply public/private terminology check."
      - "Apply professional truth-boundary check if identity/career claims appear."
      - "Avoid internal-only terms unless explicitly intended."

