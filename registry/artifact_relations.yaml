purpose:
  - "Make relationships between artifacts explicit and machine-readable."
  - "Prevent isolated artifacts from drifting away from canonical governance, terminology, and source rules."
  - "Support impact analysis before updates, deprecations, canonical releases, or public outputs."
  - "Define which artifacts require, support, replace, constrain, or conflict with each other."

relation_types:
  requires:
    meaning: "Artifact A needs Artifact B to be complete, valid, or reusable."
    release_impact: "If required artifact is missing or conflict, dependent artifact cannot be verified/canonical."
  supports:
    meaning: "Artifact A provides logic, source material, or structure for Artifact B."
    release_impact: "Support relation improves traceability but may not be mandatory."
  constrains:
    meaning: "Artifact A limits or governs how Artifact B may be used."
    release_impact: "Constraint violations may create conflict status."
  replaces:
    meaning: "Artifact A replaces Artifact B."
    release_impact: "Replaced artifact should become deprecated or archived."
  replaced_by:
    meaning: "Artifact A is replaced by Artifact B."
    release_impact: "Artifact A should not be used as active source."
  conflicts_with:
    meaning: "Artifact A contradicts Artifact B or creates unresolved drift."
    release_impact: "Conflict must be resolved before reuse."
  derived_from:
    meaning: "Artifact A was created from Artifact B or source material."
    release_impact: "Source lineage should be checked during verification."
  validates:
    meaning: "Artifact A defines checks used to validate Artifact B."
    release_impact: "Validation relation should be applied before status promotion."
  indexes:
    meaning: "Artifact A records or organizes Artifact B."
    release_impact: "Index must be updated when artifact status changes."
  maps:
    meaning: "Artifact A semantically maps Artifact B into pattern or term relationships."
    release_impact: "Map must be updated when patterns or terms change."

