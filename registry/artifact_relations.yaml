  relation_type: "requires | supports | constrains | replaces | replaced_by | conflicts_with | derived_from | validates | indexes | maps"
  target: "KOS-XXXX"
  reason: "Why this relation exists."
  release_impact: "none | low | medium | high | blocker"
  review_required: true
