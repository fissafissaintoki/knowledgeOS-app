governance_notes: Activated under explicit owner direction after the 2026-07-12 Dimitrojaner/RWOM canon-drift incident. Canonical promotion requires live regression evidence and explicit owner approval. Does not claim hidden platform self-modification.
reuse_rules:
  use_when:
  - A user correction, stop signal, active-state conflict, canon miss, premature tool call, or material output drift must become a reusable prevention mechanism.
  - A named recurring visual entity or definite world location requires canon retrieval and preflight locks before generation.
  - Repository or system work requires audit before build.
  do_not_use_when:
  - The issue is a trivial wording preference with no reusable failure pattern.
  - The protocol would be used to bypass human ownership or domain-specific validation.
  - Someone wants to claim that model weights or hidden system instructions were modified.
